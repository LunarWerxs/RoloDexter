name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # scripts/ holds the release gates (version check, parity probes, sweep),
      # so it is linted and type-checked like the package itself.
      - name: Lint (ruff)
        run: |
          ruff check src/ tests/ scripts/
          ruff format --check src/ tests/ scripts/

      - name: Type check (mypy)
        run: mypy src/ scripts/

      - name: Additional static analysis
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          deptry .
          vulture src scripts --min-confidence 80
          pylint --errors-only src/rolodexter

      - name: Test (pytest + coverage)
        run: pytest --cov=rolodexter --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  minimal-install:
    timeout-minutes: 30
    name: Minimal install (pip install . only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # No extras: this is what `pip install rolodexter` gives most users
      # (phonenumbers and nameparser only, no rapidfuzz/pandas/unidecode).
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Smoke test from outside the repo
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import rolodexter

          result = rolodexter.ContactMapper().map_payload(
              {"First Name": "ada", "E-mail": "ada@example.com"}
          )
          assert "first_name" in result.normalized, result.normalized
          assert "email" in result.normalized, result.normalized
          PY
          rolodexter fields | grep -q first_name

  # packages/js keeps two lockfiles: package-lock.json for npm ci here, and
  # bun.lock for local installs (bunfig.toml's release-age cooldown). A frozen
  # Bun install fails when bun.lock no longer matches package.json.
  bun-lock:
    timeout-minutes: 15
    name: Bun lockfile in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Frozen install
        working-directory: packages/js
        run: bun install --frozen-lockfile --ignore-scripts

  secret-scan:
    timeout-minutes: 30
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # full history so gitleaks can scan every commit

      - name: Run gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$ASSET" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            | grep " ${ASSET}\$" | sha256sum -c -
          tar -xzf "$ASSET" gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1

  test-js:
    timeout-minutes: 60
    name: Test JS (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "20"
          - os: ubuntu-latest
            node-version: "24"
          - os: macos-latest
            node-version: "24"
          - os: windows-latest
            node-version: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install Python parity dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install dependencies
        working-directory: packages/js
        run: npm ci

      - name: Type check
        working-directory: packages/js
        run: npm run typecheck

      # Each leg runs the suite once. Coverage thresholds need Node >= 22, so
      # the Node 24 legs run the suite through coverage instead of twice.
      - name: Test
        if: matrix.node-version != '24'
        working-directory: packages/js
        run: npm test

      - name: Test with coverage (thresholds)
        if: matrix.node-version == '24'
        working-directory: packages/js
        run: npm run coverage

      - name: Python/NPM parity probes
        working-directory: packages/js
        run: npm run check:parity

      - name: Cross-language differential sweep
        working-directory: packages/js
        run: npm run check:sweep

      - name: Pack check
        working-directory: packages/js
        run: npm pack --dry-run

      # Installs the packed tarball into an empty folder and runs both bins by
      # name. A broken bin link (H5) prints nothing and exits 0, so require output.
      - name: Installed-tarball smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL_DIR="$(mktemp -d)"
          APP_DIR="$(mktemp -d)"
          (cd packages/js && npm pack --ignore-scripts --pack-destination "$TARBALL_DIR")
          cd "$APP_DIR"
          npm init -y >/dev/null
          npm install "$TARBALL_DIR"/rolodexter-*.tgz
          FIELDS="$(npx --no-install rolodexter fields)"
          echo "$FIELDS" | grep -q first_name || { echo "rolodexter fields printed no first_name"; exit 1; }
          HELP="$(npx --no-install rolodexter-i18n --help)"
          test -n "$HELP" || { echo "rolodexter-i18n --help printed nothing"; exit 1; }

  build:
    timeout-minutes: 60
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, test-js, minimal-install]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Installed-wheel smoke
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/rolodexter" fields | grep -q first_name
