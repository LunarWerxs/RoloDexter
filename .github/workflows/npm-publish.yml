name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks and npm pack without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # Supports npm provenance/trusted publishing when configured

jobs:
  publish:
    name: Publish JS package
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/rolodexter

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/js/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install Python parity dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install dependencies
        working-directory: packages/js
        run: npm ci

      - name: Type check
        working-directory: packages/js
        run: npm run typecheck

      - name: Test
        working-directory: packages/js
        run: npm test

      - name: Python/NPM parity probes
        working-directory: packages/js
        run: npm run check:parity

      - name: Pack check
        working-directory: packages/js
        run: npm pack --dry-run

      - name: Publish to NPM
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        working-directory: packages/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
