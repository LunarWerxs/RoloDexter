[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rolodexter"
version = "2.12.0"
description = "The universal contact field mapper — route messy, inconsistent contact data to a clean canonical schema."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "RoloDexter Contributors" }]
keywords = [
    "contact",
    "mapper",
    "normalizer",
    "etl",
    "crm",
    "field-mapping",
    "data-cleaning",
    "hubspot",
    "salesforce",
    "mailchimp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
# Upper bound on phonenumbers: it ships new metadata roughly monthly and a
# major bump can shift parsing behavior; <10 keeps 8.x/9.x while blocking the
# next, untested major.
# nameparser 2.2 deprecates mutating its shared CONSTANTS singleton for removal
# in 3.0; this package uses a private Constants instance since 2.12.0, but 3.0
# is an untested major and is blocked the same way phonenumbers' next one is.
dependencies = ["phonenumbers>=9.0.39,<10", "nameparser>=2.3.0,<3"]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.14.6"]
i18n-generate = ["deep-translator>=1.11.4", "unidecode>=1.4.0"]
pandas = ["pandas>=3.0.5"]
all = [
    "rapidfuzz>=3.14.6",
    "deep-translator>=1.11.4",
    "unidecode>=1.4.0",
    "pandas>=3.0.5",
]
dev = [
    "rapidfuzz>=3.14.6",
    "deep-translator>=1.11.4",
    "unidecode>=1.4.0",
    "pandas>=3.0.5",
    # Keep mypy's Python 3.10 target compatible with NumPy stubs in CI.
    # numpy>=2.3 requires Python>=3.11, so the floor stays on the last 2.2.x
    # patch that still installs on the 3.10 floor; <2.5 keeps the cap this
    # comment already documents.
    "numpy>=2.2.6,<2.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.168.0",
    # tomllib is stdlib on 3.11+; the test suite reads pyproject.toml on 3.10.
    "tomli>=2.4.1; python_version < '3.11'",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "deptry>=0.25.1",
    "vulture>=2.16",
    "pylint>=4.0.8",
]

[project.scripts]
rolodexter = "rolodexter.__main__:main"
rolodexter-i18n = "rolodexter.i18n:main"

[project.urls]
Homepage = "https://github.com/LunarWerxs/RoloDexter"
Repository = "https://github.com/LunarWerxs/RoloDexter"
Documentation = "https://github.com/LunarWerxs/RoloDexter#readme"
Issues = "https://github.com/LunarWerxs/RoloDexter/issues"
Changelog = "https://github.com/LunarWerxs/RoloDexter/blob/main/CHANGELOG.md"

# ── Setuptools ────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rolodexter" = ["patterns.json", "i18n/.gitkeep"]

# ── Pytest ────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

# ── Coverage ──────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["rolodexter"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

# ── Ruff ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = ["E501"] # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["rolodexter"]

# ── Deptry ───────────────────────────────────────────────────────────

[tool.deptry]
exclude = ["build"]

[tool.deptry.per_rule_ignores]
DEP002 = ["pytest-cov", "ruff", "mypy", "deptry", "vulture", "pylint", "numpy"]
DEP003 = ["rolodexter"]
# parity_sweep_values is a sibling of scripts/parity_sweep.py, imported off
# sys.path[0] rather than installed, so deptry reads it as a third party.
DEP001 = ["parity_sweep_values"]

# ── Mypy ──────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# nameparser currently ships no type stubs/py.typed marker in some resolver
# environments. Keep this as a config-level override instead of line-level
# ignores so newer mypy releases do not fail on unused ignore comments.
[[tool.mypy.overrides]]
module = ["nameparser.*"]
ignore_missing_imports = true
