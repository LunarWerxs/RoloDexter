schema: hydra-rsi/1
# Size of the shipped rolodexter package (src/rolodexter code and patterns.json) as committed at HEAD.
# It is what every user installs and imports, so smaller is better at equal behaviour.
metrics:
  - id: package.shipped_bytes
    kind: size
    better: lower
    unit: bytes
    measure: "python scripts/rsi/shipped_bytes.py"
    pick: 'shipped_bytes=(\d+)'
    gate: exact
    light: true
